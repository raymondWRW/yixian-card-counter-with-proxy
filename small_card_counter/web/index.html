<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YiXian Counter (Lite)</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header id="titlebar">
    <span class="title" id="ui-title">剩余卡牌</span>
    <span id="status-dot" class="dot" title="proxy status"></span>
    <span id="round-pill" class="round-pill">R—</span>
    <span class="spacer"></span>
    <button id="btn-lang" class="tbtn" title="切换语言 / Toggle language">中</button>
    <button id="btn-quit" class="tbtn" title="退出">✕</button>
  </header>

  <main id="content">
    <section class="card" id="counter-card">
      <div id="counter-list" class="counter">
        <span class="empty-note" id="ui-empty">等待游戏…</span>
      </div>
    </section>
  </main>

  <script src="card_names.js"></script>
  <script src="ui.js"></script>
</body>
</html>
