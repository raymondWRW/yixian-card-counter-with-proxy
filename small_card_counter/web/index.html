<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YiXian Counter (Lite)</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header id="titlebar">
    <span class="title" id="ui-title">剩余卡牌</span>
    <span id="status-dot" class="dot" title="proxy status"></span>
    <span id="round-pill" class="round-pill">R—</span>
    <span class="spacer"></span>
    <button id="btn-lang" class="tbtn" title="切换语言 / Toggle language">中</button>
    <button id="btn-quit" class="tbtn" title="退出">✕</button>
  </header>

  <main id="content">
    <!-- Update banner — shown only when the app discovers a newer version
         on Gitee at startup. Clicking it triggers download + SHA256-verify +
         self-replace. Hidden by default (display:none). -->
    <section id="update-banner" class="update-banner" style="display:none">
      <span class="update-text">
        <strong id="update-title">有新版本</strong>
        <span id="update-version" class="update-version"></span>
      </span>
      <button id="update-btn" class="update-btn">更新</button>
      <button id="update-dismiss" class="update-dismiss" title="dismiss">×</button>
    </section>

    <section class="card" id="counter-card">
      <div id="counter-list" class="counter">
        <span class="empty-note" id="ui-empty">等待游戏…</span>
      </div>
    </section>
  </main>

  <!-- Bottom-right drag handle for proportional resizing. -->
  <div id="resize-handle" title="Drag to resize"></div>

  <script src="card_names.js"></script>
  <script src="ui.js"></script>
</body>
</html>
